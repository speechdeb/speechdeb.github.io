<!-- === Frontend Signup Form (converted, wired to Supabase) === -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="module" src="common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = "https://tdaykujyicpvokrkryea.supabase.co";
    const SUPABASE_KEY = "sb_publishable_m_eAW0KQTU_GYz0KhsLIbw_ltdhysCv";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  </script>
</head>
<body>
  <main>
    <div id="authBox" class="authContainer">
      <h2 id="formHeading">Sign Up</h2>
      <form id="signupForm" onsubmit="return handleSignup(event)">
        <input
          type="email"
          id="signupEmail"
          placeholder="Email"
          required
        />
        <input
          type="password"
          id="signupPassword"
          placeholder="Password"
          required
        />
        <!-- ✅ NEW: Repeat Password field -->
        <input
          type="password"
          id="signupPasswordConfirm"
          placeholder="Repeat password"
          aria-label="Repeat password to confirm"
          required
        />
        <button type="submit">Sign Up</button>
        <p id="signupError"></p>
      </form>
      <p>Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>
  <script>
    async function handleSignup(event) {
      event.preventDefault();
      const email    = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value.trim();
      const confirm  = document.getElementById("signupPasswordConfirm").value.trim();
      const errorEl  = document.getElementById("signupError");

      if (errorEl) {
        errorEl.textContent = "";
        errorEl.style.color = "";
      }

      if (password !== confirm) {
        const msg = "Passwords do not match. Please type the same password twice.";
        if (errorEl) {
          errorEl.textContent = msg;
          errorEl.style.color = "red";
        }
        alert(msg);
        return false;
      }

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

      if (error) {
        const msg = error.message || "Signup failed.";
        if (msg.toLowerCase().includes("already") || msg.toLowerCase().includes("registered")) {
          alert("An account with that email already exists!");
        } else {
          alert(msg);
        }
        if (errorEl) {
          errorEl.textContent = msg;
          errorEl.style.color = "red";
        }
        return false;
      }

      alert("Successfully created an account! Check your email to confirm it, then log in.");
      window.location.href = "login.html";
      return false;
    }
  </script>
</body>
</html>
