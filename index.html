<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = "https://tdaykujyicpvokrkryea.supabase.co";
    const SUPABASE_KEY = "sb_publishable_m_eAW0KQTU_GYz0KhsLIbw_ltdhysCv";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      const guestFromUrl = params.get("guest") === "1";

      let guestFromStorage = false;
      try {
        guestFromStorage = localStorage.getItem("speechdeb_guest") === "1";
      } catch (e) {
        // localStorage might not be available (very rare), just ignore
      }

      const guestMode = guestFromUrl || guestFromStorage;

      // 1) Guest mode: skip login, go straight to editor
      if (guestMode) {
        try {
          localStorage.setItem("speechdeb_guest", "1");
        } catch (e) {}
        window.location.href = "editor.html"; // change if filename differs
        return;
      }

      // 2) Real Supabase session check (replaces the old broken form-POST
      // auto-login, which had nowhere to submit to once PHP was gone)
      const { data: sessionData } = await supabaseClient.auth.getSession();
      const currentUser = sessionData?.session?.user;

      if (currentUser) {
        window.location.href = "user.html";
      } else {
        // 3) No active session + not guest -> go to login screen
        window.location.href = "login.html";
      }
    });
  </script>
</head>
<body>
</body>
</html>
